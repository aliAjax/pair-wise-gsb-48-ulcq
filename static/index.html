<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>证券结算净额批次</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<main>
  <h1>证券结算净额批次</h1>
  <p>最小演示页。日终净额 → 确认冻结 → 托管回执对账 → 交收的完整流程通过 README 中的 JSON 接口调用。</p>
  <div class="row">
    <button id="instructions">结算指令</button>
    <button id="batches">净额批次</button>
    <button id="receipts">托管回执</button>
    <button id="discrepancies">差异</button>
    <button id="stats">状态统计</button>
  </div>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("instructions").onclick = () => show("/api/instructions?limit=20");
document.getElementById("batches").onclick = () => show("/api/batches?limit=20");
document.getElementById("receipts").onclick = () => show("/api/receipts");
document.getElementById("discrepancies").onclick = () => show("/api/discrepancies");
document.getElementById("stats").onclick = () => show("/api/stats");
</script>
</body>
</html>
